name: Guarded Beta Publishing
run-name: Beta ${{ inputs.mode }} at ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate, test-build without publishing, or explicitly publish
        type: choice
        options: [validate, build, publish]
        default: validate
        required: true
      expected_sha:
        description: Full 40-character current beta revision
        type: string
        required: true
      ci_run_id:
        description: Latest successful CI run ID for this exact beta revision
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Shared with versioned beta/RC releases. Never cancel an active publication.
concurrency:
  group: beta-publishing
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/trifocals3537/tessarr
  BETA_VERSION_BASE: "2.6.0"

jobs:
  validate:
    name: Verify exact beta revision and CI
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Verify publication request
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_MODE: ${{ inputs.mode }}
          BETA_EXPECTED_SHA: ${{ inputs.expected_sha }}
          BETA_CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node scripts/beta-publish-gate.mjs

  build:
    name: Build and verify approved beta OCI image
    needs: validate
    if: >-
      inputs.mode != 'validate' &&
      github.repository_id == '1426317456' &&
      github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    env:
      BETA_MODE: ${{ inputs.mode }}
      BETA_EXPECTED_SHA: ${{ inputs.expected_sha }}
      BETA_CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Recheck before building
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/beta-publish-gate.mjs
      - name: Calculate unique beta version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BETA_VERSION_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${BETA_VERSION_BASE}-beta.${GITHUB_RUN_ID}.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Install OCI image transfer tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=beta
            type=raw,value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Tessarr
            org.opencontainers.image.description=Self-hosted debrid and Usenet media bridge with qBittorrent and SABnzbd-compatible APIs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/README.md
            org.opencontainers.image.authors=Tessarr contributors
            org.opencontainers.image.licenses=MIT
      - name: Build multi-platform OCI archive without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/beta-image.tar
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            CHANNEL=beta
          # Export one named image. The shared channel tag is promoted later.
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=beta
          cache-to: type=gha,scope=beta,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify OCI transfer without registry writes
        run: >-
          skopeo copy --all --preserve-digests
          "oci-archive:$RUNNER_TEMP/beta-image.tar"
          "oci:$RUNNER_TEMP/beta-transfer-check:verified"
      - name: Save verified OCI archive
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: approved-beta-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beta-image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish approved beta OCI image
    needs: [validate, build]
    if: >-
      inputs.mode == 'publish' &&
      github.repository_id == '1426317456' &&
      github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      BETA_MODE: publish
      BETA_EXPECTED_SHA: ${{ inputs.expected_sha }}
      BETA_CI_RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Install OCI image transfer tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends skopeo
      - name: Download this run's verified archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/approved-beta
          merge-multiple: true
      - name: Revalidate and publish OCI archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETA_VERSION: ${{ needs.build.outputs.version }}
        run: bash scripts/publish-beta-image.sh "$RUNNER_TEMP/approved-beta/beta-image.tar" "$BETA_VERSION" beta
